name: Deploy SoundPaid to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve or create Netlify site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PREFERRED_SITE_ID: 07566af8-8c7c-42e7-a8fc-d408cc5804dc
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $NETLIFY_AUTH_TOKEN")
          if curl -fsS "${auth[@]}" "https://api.netlify.com/api/v1/sites/$PREFERRED_SITE_ID" >/tmp/site.json 2>/dev/null; then
            site_id="$PREFERRED_SITE_ID"
            site_url="$(jq -r '.ssl_url // .url // empty' /tmp/site.json)"
          else
            code="$(curl -sS -o /tmp/newsite.json -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: application/json' "https://api.netlify.com/api/v1/sites" -d '{"name":"soundpaid-launchpad"}')"
            if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then
              code="$(curl -sS -o /tmp/newsite.json -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: application/json' "https://api.netlify.com/api/v1/sites" -d '{}')"
            fi
            if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then
              echo "Netlify site creation failed with HTTP $code"
              jq -r '.message // .error // empty' /tmp/newsite.json || true
              exit 1
            fi
            site_id="$(jq -r '.id' /tmp/newsite.json)"
            site_url="$(jq -r '.ssl_url // .url // empty' /tmp/newsite.json)"
          fi
          test -n "$site_id"
          echo "NETLIFY_SITE_ID=$site_id" >> "$GITHUB_ENV"
          echo "NETLIFY_SITE_URL=$site_url" >> "$GITHUB_ENV"
          echo "Using Netlify site: $site_url"

      - name: Deploy production site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx -y netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"

      - name: Print public URL
        run: |
          echo "SoundPaid public URL: $NETLIFY_SITE_URL"
